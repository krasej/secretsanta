name: Deploy backend -> Cloud Run

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Debug gcloud config
        run: |
          gcloud auth list
          gcloud config get-value project

      - name: Build container and push
        run: |
          gcloud builds submit ./backend --tag gcr.io/${{ secrets.GCP_PROJECT }}/secret-santa-backend

      - name: Create or update Secret Manager secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if ! gcloud secrets describe firebase-service-account >/dev/null 2>&1; then
            gcloud secrets create firebase-service-account --replication-policy=automatic
          fi
          python3 -c 'import json, os, pathlib; secret = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"]); path = "/tmp/firebase-service-account.json"; pathlib.Path(path).write_text(json.dumps(secret)); print(path)'
          gcloud secrets versions add firebase-service-account --data-file=/tmp/firebase-service-account.json

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy secret-santa-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/secret-santa-backend \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --update-secrets FIREBASE_SERVICE_ACCOUNT_JSON=firebase-service-account:latest
