name: Deploy backend -> Cloud Run

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Debug gcloud config
        run: |
          gcloud auth list
          gcloud config get-value project

      - name: Build container and push
        run: |
          gcloud builds submit ./backend --tag gcr.io/${{ secrets.GCP_PROJECT }}/secret-santa-backend

      - name: Deploy to Cloud Run
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          SECRET=$(python3 -c 'import json,os; print(json.dumps(json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"])))')
          gcloud run deploy secret-santa-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/secret-santa-backend \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars FIREBASE_SERVICE_ACCOUNT_JSON="$SECRET"
